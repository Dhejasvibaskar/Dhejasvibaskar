name: Update Neural Identity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: neural-identity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate original profile graphics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python generate_profile.py
      - name: Commit changed images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/neural-identity.svg assets/contribution-city.svg
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update profile graphics'
            git push
          fi
